global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: taskflow
    static_configs:
      - targets: ["taskflow:8080"]

  - job_name: executor-worker
    static_configs:
      - targets: ["executor-worker:9093"]
