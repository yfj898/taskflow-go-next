apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: executor-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: executor-worker
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
