events {}

http {
  resolver 127.0.0.11 valid=2s ipv6=off;

  upstream taskflow_regions {
    zone taskflow_regions 64k;
    server taskflow:8080 resolve max_fails=1 fail_timeout=1s;
    server taskflow-region-b:8080 resolve backup;
  }

  server {
    listen 8080;

    location / {
      proxy_connect_timeout 1s;
      proxy_read_timeout 10s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_set_header Host $host;
      proxy_set_header X-TaskFlow-Global-Route phase45;
      proxy_pass http://taskflow_regions;
    }
  }
}
