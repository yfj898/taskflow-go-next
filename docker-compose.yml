  ai-gateway:
    image: python:3.13-alpine
    command: ["python", "/scripts/ai-gateway-mock.py"]
    environment:
      PROVIDER_NAME: mock-primary
      MODEL_NAME: mock-v1
      RESULT_PREFIX: "mock-ai:"
      REQUIRE_TRACEPARENT: "true"
    volumes:
      - ./scripts:/scripts:ro
    profiles: ["ai-smoke"]

  ai-gateway-fail:
    image: python:3.13-alpine
    command: ["python", "/scripts/ai-gateway-mock.py"]
    environment:
      FAIL_STATUS: "503"
    volumes:
      - ./scripts:/scripts:ro
    profiles: ["ai-smoke"]

  ai-gateway-alt:
    image: python:3.13-alpine
    command: ["python", "/scripts/ai-gateway-mock.py"]
    environment:
      PROVIDER_NAME: mock-alt
      MODEL_NAME: mock-alt-v1
      RESULT_PREFIX: "alt-ai:"
      REQUIRE_TRACEPARENT: "true"
      DELAY_MS: "200"
    volumes:
      - ./scripts:/scripts:ro
    profiles: ["ai-smoke"]

  ai-gateway-slow:
    image: python:3.13-alpine
    command: ["python", "/scripts/ai-gateway-mock.py"]
    environment:
      PROVIDER_NAME: mock-slow
      MODEL_NAME: slow-v1
      RESULT_PREFIX: "slow-ai:"
      REQUIRE_TRACEPARENT: "true"
      DELAY_MS: ${AI_GATEWAY_SLOW_DELAY_MS:-700}
    volumes:
      - ./scripts:/scripts:ro
    profiles: ["ai-smoke"]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  alertmanager:
    profiles: ["phase43-smoke", "observability"]
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:19094:9093"

  grafana:
    profiles: ["phase43-smoke", "observability"]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: phase43-admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/taskflow-overview.json:/var/lib/grafana/dashboards/taskflow-overview.json:ro
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - taskflow

  kafka:
    image: apache/kafka:4.3.1
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "127.0.0.1:19092:19092"

  minio-primary:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["archive-s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_PRIMARY_ROOT_USER:-taskflow-primary}
      MINIO_ROOT_PASSWORD: ${MINIO_PRIMARY_ROOT_PASSWORD:-taskflow-primary-secret}
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - minio-primary-data:/data

  minio-replica:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["archive-s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_REPLICA_ROOT_USER:-taskflow-replica}
      MINIO_ROOT_PASSWORD: ${MINIO_REPLICA_ROOT_PASSWORD:-taskflow-replica-secret}
    ports:
      - "127.0.0.1:19002:9000"
    volumes:
      - minio-replica-data:/data

volumes:
  mysql-data:
  mysql-replica-data:
  mysql-recovery-data:
  dlq-archive:
  dlq-archive-replica:
  minio-primary-data:
  minio-replica-data:
