  taskflow-region-b:
    profiles: ["phase45-smoke"]
    image: taskflow-go:local
    environment:
      HTTP_ADDR: :8080
      PPROF_ADDR: 127.0.0.1:6060
      MYSQL_DSN: ${PHASE45_REGION_B_DSN:-taskflow:taskflow@tcp(mysql:3306)/taskflow?charset=utf8mb4&parseTime=True&loc=Local&interpolateParams=true}
      REDIS_ADDR: redis:6379
      REDIS_QUEUE_KEY: ${PHASE45_QUEUE_KEY:-taskflow:phase45:queue}
      QUEUE_BACKEND: redis
      EXECUTION_BACKEND: local
      WORKER_COUNT: 1
      CONTROL_PLANE_AUTH_ENABLED: "false"
      CONTROL_PLANE_AUDIT_ENABLED: "true"
      CONTROL_PLANE_AUDIT_RETENTION_ENABLED: "false"
      RECONCILE_DISTRIBUTED_COORDINATION: "false"
      QUEUE_COMPACTION_ENABLED: "false"
      QUEUE_DLQ_LIFECYCLE_ENABLED: "false"
      QUEUE_DLQ_ARCHIVE_ENABLED: "false"
    ports:
      - "127.0.0.1:18091:8080"
    depends_on:
      redis:
        condition: service_healthy

  global-router:
    profiles: ["phase45-smoke"]
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/multiregion/global-router.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:18090:8080"

  executor-worker:
    image: taskflow-go:local
    build:
      context: .
      args:
        GO_VERSION: ${GO_VERSION:-1.26.8}
        GOPROXY: "${GOPROXY:-https://proxy.golang.org|https://goproxy.cn|direct}"
    entrypoint: ["/executor-worker"]
    environment:
      EXECUTOR_GRPC_LISTEN: :9091
      EXECUTOR_METRICS_ADDR: :9093
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      OTEL_LOG_SPANS: ${OTEL_LOG_SPANS:-false}
      AI_PROVIDER: ${AI_PROVIDER:-mock-primary}
