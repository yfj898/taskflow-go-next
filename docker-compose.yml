services:
  mysql:
    image: mysql:8.4
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: taskflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      # Force TCP instead of the local Unix socket so dependents only start
      # after MySQL is actually accepting network connections.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  mysql-replica:
    profiles: ["phase42-smoke", "phase45-smoke"]
    image: mysql:8.4
    command: ["--server-id=2", "--log-bin=mysql-bin", "--relay-log=relay-bin", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: taskflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-replica-data:/var/lib/mysql

  mysql-recovery:
    profiles: ["phase42-smoke"]
    image: mysql:8.4
    command: ["--server-id=3", "--log-bin=mysql-bin", "--relay-log=relay-bin", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:14306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-recovery-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  siem-sink:
    profiles: ["phase25-smoke", "phase26-smoke", "phase27-smoke", "phase28-smoke", "phase29-smoke", "phase30-smoke", "phase31-smoke", "phase32-smoke", "phase33-smoke", "phase34-smoke", "phase35-smoke", "phase36-smoke", "phase37-smoke", "phase38-smoke", "phase39-smoke", "phase40-smoke"]
    image: python:3.13-alpine
    command: ["python3", "/app/scripts/siem-sink-mock.py"]
    environment:
      PORT: "8080"
      SIEM_SIGNING_KEY: ${CONTROL_PLANE_SIEM_SIGNING_KEY:-phase25-signing-key}
      SIEM_SIGNING_KEY_ID: ${CONTROL_PLANE_SIEM_SIGNING_KEY_ID:-phase25-key-v1}
      SIEM_SIGNING_KEYS: ${SIEM_SIGNING_KEYS:-}
      SIEM_BEARER_TOKEN: ${CONTROL_PLANE_SIEM_BEARER_TOKEN:-phase25-sink-token}
      SIEM_VAULT_VERIFY_ENDPOINT: ${SIEM_VAULT_VERIFY_ENDPOINT:-}
      SIEM_VAULT_TOKEN: ${SIEM_VAULT_TOKEN:-}
      SIEM_VAULT_KEY_ID: ${SIEM_VAULT_KEY_ID:-}
      SIEM_RECEIVER_ID: ${PHASE29_PRIMARY_RECEIVER_ID:-receiver-primary}
      SIEM_RECEIVER_GENERATION: ${PHASE29_PRIMARY_RECEIVER_GENERATION:-1}
      SIEM_RECEIVER_TERM: ${PHASE30_PRIMARY_RECEIVER_TERM:-1}
      SIEM_ACTIVE_RECEIVER: ${PHASE30_ACTIVE_RECEIVER:-receiver-primary}
      SIEM_CHECKPOINT_HMAC_KEY: ${CONTROL_PLANE_SIEM_CHECKPOINT_HMAC_KEY:-}
      SIEM_CHECKPOINT_HMAC_KEY_ID: ${CONTROL_PLANE_SIEM_CHECKPOINT_HMAC_KEY_ID:-}
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "18084:8080"

  siem-sink-secondary:
    profiles: ["phase29-smoke", "phase30-smoke", "phase31-smoke", "phase32-smoke", "phase33-smoke", "phase34-smoke", "phase35-smoke", "phase36-smoke", "phase37-smoke", "phase38-smoke", "phase39-smoke", "phase40-smoke"]
    image: python:3.13-alpine
    command: ["python3", "/app/scripts/siem-sink-mock.py"]
    environment:
      PORT: "8080"
      SIEM_SIGNING_KEY: ${CONTROL_PLANE_SIEM_SIGNING_KEY:-phase25-signing-key}
      SIEM_SIGNING_KEY_ID: ${CONTROL_PLANE_SIEM_SIGNING_KEY_ID:-phase25-key-v1}
      SIEM_SIGNING_KEYS: ${SIEM_SIGNING_KEYS:-}
      SIEM_BEARER_TOKEN: ${CONTROL_PLANE_SIEM_BEARER_TOKEN:-phase25-sink-token}
      SIEM_RECEIVER_ID: ${PHASE29_SECONDARY_RECEIVER_ID:-receiver-secondary}
      SIEM_RECEIVER_GENERATION: ${PHASE29_SECONDARY_RECEIVER_GENERATION:-1}
      SIEM_RECEIVER_TERM: ${PHASE30_SECONDARY_RECEIVER_TERM:-1}
      SIEM_ACTIVE_RECEIVER: ${PHASE30_ACTIVE_RECEIVER:-receiver-primary}
      SIEM_CHECKPOINT_HMAC_KEY: ${CONTROL_PLANE_SIEM_CHECKPOINT_HMAC_KEY:-}
      SIEM_CHECKPOINT_HMAC_KEY_ID: ${CONTROL_PLANE_SIEM_CHECKPOINT_HMAC_KEY_ID:-}
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "18085:8080"

  siem-governance:
    profiles: ["phase32-smoke", "phase33-smoke", "phase34-smoke", "phase35-smoke", "phase36-smoke", "phase37-smoke", "phase38-smoke", "phase39-smoke", "phase40-smoke"]
    image: python:3.13-alpine
    command: ["python3", "/app/scripts/phase32-governance-mock.py"]
    environment:
      PORT: "8080"
      GOVERNANCE_BEARER_TOKEN: ${CONTROL_PLANE_SIEM_GOVERNANCE_BEARER_TOKEN:-phase32-governance-token}
      GOVERNANCE_SIGNING_KEY: ${CONTROL_PLANE_SIEM_GOVERNANCE_SIGNING_KEY:-phase32-governance-signing-key}
      GOVERNANCE_SIGNING_KEY_ID: ${CONTROL_PLANE_SIEM_GOVERNANCE_SIGNING_KEY_ID:-phase32-governance-v1}
      GOVERNANCE_REPLICA_ID: ${CONTROL_PLANE_SIEM_GOVERNANCE_PRIMARY_REPLICA_ID:-governance-primary}
      GOVERNANCE_RECEIPT_HMAC_KEY: ${CONTROL_PLANE_SIEM_GOVERNANCE_PRIMARY_RECEIPT_HMAC_KEY:-phase38-primary-receipt-key}
      GOVERNANCE_RECEIPT_HMAC_KEY_ID: ${CONTROL_PLANE_SIEM_GOVERNANCE_PRIMARY_RECEIPT_HMAC_KEY_ID:-phase38-primary-receipt-v1}
      GOVERNANCE_RECEIPT_KEY_GENERATION: ${CONTROL_PLANE_SIEM_GOVERNANCE_PRIMARY_RECEIPT_KEY_GENERATION:-1}
      GOVERNANCE_MEMBERSHIP_EPOCH: ${PHASE39_GOVERNANCE_PRIMARY_MEMBERSHIP_EPOCH:-1}
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "19704:8080"

  siem-governance-secondary:
    profiles: ["phase38-smoke", "phase39-smoke", "phase40-smoke"]
    image: python:3.13-alpine
    command: ["python3", "/app/scripts/phase32-governance-mock.py"]
    environment:
      PORT: "8080"
      GOVERNANCE_BEARER_TOKEN: ${CONTROL_PLANE_SIEM_GOVERNANCE_SECONDARY_BEARER_TOKEN:-phase38-governance-secondary-token}
      GOVERNANCE_SIGNING_KEY: ${CONTROL_PLANE_SIEM_GOVERNANCE_SIGNING_KEY:-phase32-governance-signing-key}
      GOVERNANCE_SIGNING_KEY_ID: ${CONTROL_PLANE_SIEM_GOVERNANCE_SIGNING_KEY_ID:-phase32-governance-v1}
      GOVERNANCE_REPLICA_ID: ${CONTROL_PLANE_SIEM_GOVERNANCE_SECONDARY_REPLICA_ID:-governance-secondary}
      GOVERNANCE_RECEIPT_HMAC_KEY: ${CONTROL_PLANE_SIEM_GOVERNANCE_SECONDARY_RECEIPT_HMAC_KEY:-phase38-secondary-receipt-key}
      GOVERNANCE_RECEIPT_HMAC_KEY_ID: ${CONTROL_PLANE_SIEM_GOVERNANCE_SECONDARY_RECEIPT_HMAC_KEY_ID:-phase38-secondary-receipt-v1}
      GOVERNANCE_RECEIPT_KEY_GENERATION: ${CONTROL_PLANE_SIEM_GOVERNANCE_SECONDARY_RECEIPT_KEY_GENERATION:-1}
      GOVERNANCE_MEMBERSHIP_EPOCH: ${PHASE39_GOVERNANCE_SECONDARY_MEMBERSHIP_EPOCH:-1}
      GOVERNANCE_FAULT_TERM: ${PHASE38_GOVERNANCE_SECONDARY_FAULT_TERM:-0}
      GOVERNANCE_FAULT_RECORD_HASH: ${PHASE38_GOVERNANCE_SECONDARY_FAULT_RECORD_HASH:-}
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "19705:8080"

  kms-signer:
    profiles: ["phase26-smoke"]
    image: python:3.13-alpine
    command: ["python3", "/app/scripts/kms-signer-mock.py"]
    environment:
      PORT: "9701"
      KMS_BEARER_TOKEN: ${CONTROL_PLANE_SIEM_REMOTE_SIGNER_BEARER_TOKEN:-phase26-kms-token}
      KMS_SIGNING_KEYS: ${KMS_SIGNING_KEYS:-phase26-kms-v2=phase26-kms-secret}
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "19701:9701"

  aws-kms:
    profiles: ["phase27-smoke", "phase28-smoke"]
    image: python:3.13-alpine
    command: ["python3", "/app/scripts/aws-kms-mock.py"]
    environment:
      PORT: "9702"
      AWS_ACCESS_KEY_ID: ${CONTROL_PLANE_SIEM_AWS_ACCESS_KEY_ID:-phase27-access}
      AWS_SECRET_ACCESS_KEY: ${CONTROL_PLANE_SIEM_AWS_SECRET_ACCESS_KEY:-phase27-secret}
      AWS_SESSION_TOKEN: ${PHASE28_AWS_SESSION_TOKEN:-}
      AWS_REGION: ${CONTROL_PLANE_SIEM_AWS_KMS_REGION:-ap-southeast-1}
      AWS_KMS_KEY_ID: ${CONTROL_PLANE_SIEM_AWS_KMS_KEY_ID:-phase27-kms-key}
      AWS_KMS_HMAC_KEY: ${PHASE27_KMS_HMAC_KEY:-phase27-kms-hmac-secret}
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "19702:9702"

  aws-credentials:
    profiles: ["phase28-smoke"]
    image: python:3.13-alpine
    command: ["python3", "/app/scripts/aws-credentials-mock.py"]
    environment:
      PORT: "9703"
      AWS_ACCESS_KEY_ID: ${PHASE28_AWS_ACCESS_KEY_ID:-phase28-temp-access}
      AWS_SECRET_ACCESS_KEY: ${PHASE28_AWS_SECRET_ACCESS_KEY:-phase28-temp-secret}
      AWS_SESSION_TOKEN: ${PHASE28_AWS_SESSION_TOKEN:-phase28-session-token}
      AWS_ROLE_ARN: ${PHASE28_AWS_ROLE_ARN:-arn:aws:iam::123456789012:role/taskflow-phase28}
      AWS_ROLE_NAME: ${PHASE28_AWS_ROLE_NAME:-taskflow-phase28}
      AWS_WEB_IDENTITY_TOKEN: ${PHASE28_AWS_WEB_IDENTITY_TOKEN:-phase28-web-identity-token}
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "19703:9703"

  vault:
    profiles: ["phase28-smoke"]
    image: hashicorp/vault:2.0.4
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${PHASE28_VAULT_ROOT_TOKEN:-phase28-vault-root}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: ["server", "-dev"]
    ports:
      - "18200:8200"

  oidc-mock:
    profiles: ["phase41-smoke"]
    image: golang:1.26
    command: ["/usr/local/go/bin/go", "run", "/app/scripts/phase41-oidc-mock"]
    environment:
      OIDC_ADDR: ":8080"
      OIDC_ISSUER: http://oidc-mock:8080
      OIDC_AUDIENCE: taskflow-control-plane
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "127.0.0.1:19706:8080"

  taskflow:
    image: taskflow-go:local
    build:
      context: .
      args:
        GO_VERSION: ${GO_VERSION:-1.26.8}
        GOPROXY: "${GOPROXY:-https://proxy.golang.org|https://goproxy.cn|direct}"
    environment:
      HTTP_ADDR: :8080
      PPROF_ADDR: :6060
      MYSQL_DSN: "${MYSQL_DSN:-taskflow:taskflow@tcp(mysql:3306)/taskflow?charset=utf8mb4&parseTime=True&loc=Local&interpolateParams=true}"
      MYSQL_FAILOVER_DSNS: ${MYSQL_FAILOVER_DSNS:-}
      MYSQL_CONNECT_TIMEOUT_MS: ${MYSQL_CONNECT_TIMEOUT_MS:-3000}
      MYSQL_MAX_OPEN_CONNS: ${MYSQL_MAX_OPEN_CONNS:-50}
      MYSQL_MAX_IDLE_CONNS: ${MYSQL_MAX_IDLE_CONNS:-10}
      MYSQL_SKIP_DEFAULT_TX: ${MYSQL_SKIP_DEFAULT_TX:-true}
      REDIS_ADDR: redis:6379
      REDIS_QUEUE_KEY: ${REDIS_QUEUE_KEY:-taskflow:queue}
      QUEUE_BACKEND: ${QUEUE_BACKEND:-redis}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-taskflow.tasks}
      KAFKA_GROUP: ${KAFKA_GROUP:-taskflow-workers}
      EXECUTION_BACKEND: ${EXECUTION_BACKEND:-grpc}
      EXECUTOR_GRPC_TARGET: executor-worker:9091
      EXECUTOR_TIMEOUT_MS: 5000
      CIRCUIT_FAILURES: 5
      CIRCUIT_OPEN_MS: 5000
      AI_PROVIDER: ${AI_PROVIDER:-mock-primary}
      AI_PROVIDER_KIND: ${AI_PROVIDER_KIND:-gateway}
      AI_ENDPOINT: ${AI_ENDPOINT:-http://ai-gateway:9000/generate}
      AI_BEARER_TOKEN: ${AI_BEARER_TOKEN:-}
      AI_MODEL: ${AI_MODEL:-mock-v1}
      AI_CAPABILITIES: ${AI_CAPABILITIES:-text,reasoning}
      AI_INPUT_COST_PER_1M: ${AI_INPUT_COST_PER_1M:-1}
      AI_OUTPUT_COST_PER_1M: ${AI_OUTPUT_COST_PER_1M:-4}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-4}
      AI_GLOBAL_MAX_CONCURRENCY: ${AI_GLOBAL_MAX_CONCURRENCY:-0}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-mock-fallback}
      AI_FALLBACK_KIND: ${AI_FALLBACK_KIND:-gateway}
      AI_FALLBACK_ENDPOINT: ${AI_FALLBACK_ENDPOINT:-}
      AI_FALLBACK_BEARER_TOKEN: ${AI_FALLBACK_BEARER_TOKEN:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_FALLBACK_CAPABILITIES: ${AI_FALLBACK_CAPABILITIES:-}
      AI_FALLBACK_INPUT_COST_PER_1M: ${AI_FALLBACK_INPUT_COST_PER_1M:-0}
      AI_FALLBACK_OUTPUT_COST_PER_1M: ${AI_FALLBACK_OUTPUT_COST_PER_1M:-0}
      AI_FALLBACK_MAX_CONCURRENCY: ${AI_FALLBACK_MAX_CONCURRENCY:-4}
      AI_FALLBACK_GLOBAL_MAX_CONCURRENCY: ${AI_FALLBACK_GLOBAL_MAX_CONCURRENCY:-0}
      AI_ROUTING_STRATEGY: ${AI_ROUTING_STRATEGY:-balanced}
      AI_PROVIDER_CIRCUIT_FAILURES: ${AI_PROVIDER_CIRCUIT_FAILURES:-3}
      AI_PROVIDER_CIRCUIT_OPEN_MS: ${AI_PROVIDER_CIRCUIT_OPEN_MS:-10000}
      AI_DEFAULT_OUTPUT_TOKENS: ${AI_DEFAULT_OUTPUT_TOKENS:-256}
      AI_SLO_REALTIME_QUEUE_MS: ${AI_SLO_REALTIME_QUEUE_MS:-50}
      AI_SLO_REALTIME_TIMEOUT_MS: ${AI_SLO_REALTIME_TIMEOUT_MS:-3000}
      AI_SLO_STANDARD_QUEUE_MS: ${AI_SLO_STANDARD_QUEUE_MS:-1000}
      AI_SLO_STANDARD_TIMEOUT_MS: ${AI_SLO_STANDARD_TIMEOUT_MS:-15000}
      AI_SLO_BATCH_QUEUE_MS: ${AI_SLO_BATCH_QUEUE_MS:-5000}
      AI_SLO_BATCH_TIMEOUT_MS: ${AI_SLO_BATCH_TIMEOUT_MS:-30000}
      AI_DISTRIBUTED_LEASE_MS: ${AI_DISTRIBUTED_LEASE_MS:-30000}
      AI_CONCURRENCY_REDIS_PREFIX: ${AI_CONCURRENCY_REDIS_PREFIX:-taskflow:ai:concurrency}
      AI_ADAPTIVE_LOAD_SHEDDING: ${AI_ADAPTIVE_LOAD_SHEDDING:-true}
      AI_PRESSURE_DEGRADED_QUEUE: ${AI_PRESSURE_DEGRADED_QUEUE:-4}
      AI_PRESSURE_OVERLOADED_QUEUE: ${AI_PRESSURE_OVERLOADED_QUEUE:-16}
      AI_PRESSURE_DEGRADED_FAILURE_RATE: ${AI_PRESSURE_DEGRADED_FAILURE_RATE:-0.2}
      AI_PRESSURE_OVERLOADED_FAILURE_RATE: ${AI_PRESSURE_OVERLOADED_FAILURE_RATE:-0.5}
      AI_PRESSURE_DEGRADED_LATENCY_MS: ${AI_PRESSURE_DEGRADED_LATENCY_MS:-2000}
      AI_PRESSURE_OVERLOADED_LATENCY_MS: ${AI_PRESSURE_OVERLOADED_LATENCY_MS:-5000}
      AI_HEDGE_ENABLED: ${AI_HEDGE_ENABLED:-false}
      AI_HEDGE_DELAY_MS: ${AI_HEDGE_DELAY_MS:-100}
      AI_HEDGE_CANCEL_WAIT_MS: ${AI_HEDGE_CANCEL_WAIT_MS:-100}
      AI_HEDGE_MAX_EXTRA_COST_USD: ${AI_HEDGE_MAX_EXTRA_COST_USD:-0.01}
      AI_TENANT_FAIR_SCHEDULING: ${AI_TENANT_FAIR_SCHEDULING:-false}
      AI_TENANT_MAX_CONSECUTIVE: ${AI_TENANT_MAX_CONSECUTIVE:-2}
      AI_TENANT_STARVATION_MS: ${AI_TENANT_STARVATION_MS:-5000}
      AI_DISTRIBUTED_TENANT_QUOTA: ${AI_DISTRIBUTED_TENANT_QUOTA:-false}
      AI_TENANT_GLOBAL_MAX_CONCURRENCY: ${AI_TENANT_GLOBAL_MAX_CONCURRENCY:-0}
      AI_TENANT_CONCURRENCY_OVERRIDES: ${AI_TENANT_CONCURRENCY_OVERRIDES:-}
      AI_BUDGET_DEFAULT_RESERVE_USD: ${AI_BUDGET_DEFAULT_RESERVE_USD:-0.01}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      CONTROL_PLANE_AUTH_ENABLED: ${CONTROL_PLANE_AUTH_ENABLED:-false}
      CONTROL_PLANE_AUTH_MODE: ${CONTROL_PLANE_AUTH_MODE:-bearer}
      CONTROL_PLANE_BEARER_TOKEN: ${CONTROL_PLANE_BEARER_TOKEN:-}
      CONTROL_PLANE_PREVIOUS_BEARER_TOKEN: ${CONTROL_PLANE_PREVIOUS_BEARER_TOKEN:-}
      CONTROL_PLANE_ADDITIONAL_BEARER_CREDENTIALS: ${CONTROL_PLANE_ADDITIONAL_BEARER_CREDENTIALS:-}
      CONTROL_PLANE_OPERATOR_ID: ${CONTROL_PLANE_OPERATOR_ID:-operator}
      CONTROL_PLANE_PREVIOUS_OPERATOR_ID: ${CONTROL_PLANE_PREVIOUS_OPERATOR_ID:-}
      CONTROL_PLANE_OIDC_ISSUER: ${CONTROL_PLANE_OIDC_ISSUER:-}
      CONTROL_PLANE_OIDC_AUDIENCE: ${CONTROL_PLANE_OIDC_AUDIENCE:-}
      CONTROL_PLANE_OIDC_JWKS_URL: ${CONTROL_PLANE_OIDC_JWKS_URL:-}
      CONTROL_PLANE_OIDC_GROUPS_CLAIM: ${CONTROL_PLANE_OIDC_GROUPS_CLAIM:-groups}
      CONTROL_PLANE_OIDC_ROLE_MAPPINGS: ${CONTROL_PLANE_OIDC_ROLE_MAPPINGS:-}
      CONTROL_PLANE_OIDC_JWKS_CACHE_TTL_MS: ${CONTROL_PLANE_OIDC_JWKS_CACHE_TTL_MS:-300000}
      CONTROL_PLANE_OIDC_CLOCK_SKEW_MS: ${CONTROL_PLANE_OIDC_CLOCK_SKEW_MS:-30000}
      CONTROL_PLANE_OIDC_RBAC_ENABLED: ${CONTROL_PLANE_OIDC_RBAC_ENABLED:-false}
      CONTROL_PLANE_AUDIT_ENABLED: ${CONTROL_PLANE_AUDIT_ENABLED:-true}
      CONTROL_PLANE_AUDIT_RETENTION_ENABLED: ${CONTROL_PLANE_AUDIT_RETENTION_ENABLED:-true}
      CONTROL_PLANE_AUDIT_LIFECYCLE_INTERVAL_MS: ${CONTROL_PLANE_AUDIT_LIFECYCLE_INTERVAL_MS:-3600000}
      CONTROL_PLANE_AUDIT_RETENTION_MS: ${CONTROL_PLANE_AUDIT_RETENTION_MS:-7776000000}
      CONTROL_PLANE_AUDIT_RETENTION_BATCH: ${CONTROL_PLANE_AUDIT_RETENTION_BATCH:-1000}
      CONTROL_PLANE_SIEM_DELIVERY_ENABLED: ${CONTROL_PLANE_SIEM_DELIVERY_ENABLED:-false}
      CONTROL_PLANE_SIEM_ENDPOINT: ${CONTROL_PLANE_SIEM_ENDPOINT:-}
      CONTROL_PLANE_SIEM_BEARER_TOKEN: ${CONTROL_PLANE_SIEM_BEARER_TOKEN:-}
      CONTROL_PLANE_SIEM_SIGNING_KEY: ${CONTROL_PLANE_SIEM_SIGNING_KEY:-}
      CONTROL_PLANE_SIEM_SIGNING_KEY_ID: ${CONTROL_PLANE_SIEM_SIGNING_KEY_ID:-taskflow-hmac-v1}
      CONTROL_PLANE_SIEM_DELIVERY_INTERVAL_MS: ${CONTROL_PLANE_SIEM_DELIVERY_INTERVAL_MS:-1000}
      CONTROL_PLANE_SIEM_DELIVERY_BATCH: ${CONTROL_PLANE_SIEM_DELIVERY_BATCH:-100}
      CONTROL_PLANE_SIEM_DELIVERY_LEASE_MS: ${CONTROL_PLANE_SIEM_DELIVERY_LEASE_MS:-30000}
      CONTROL_PLANE_SIEM_MAX_ATTEMPTS: ${CONTROL_PLANE_SIEM_MAX_ATTEMPTS:-8}
      CONTROL_PLANE_SIEM_RETRY_BASE_MS: ${CONTROL_PLANE_SIEM_RETRY_BASE_MS:-1000}
      CONTROL_PLANE_SIEM_RETRY_MAX_MS: ${CONTROL_PLANE_SIEM_RETRY_MAX_MS:-60000}
      CONTROL_PLANE_SIEM_HTTP_TIMEOUT_MS: ${CONTROL_PLANE_SIEM_HTTP_TIMEOUT_MS:-5000}
      CONTROL_PLANE_SIEM_SIGNING_PROVIDER: ${CONTROL_PLANE_SIEM_SIGNING_PROVIDER:-hmac}
      CONTROL_PLANE_SIEM_PREVIOUS_SIGNING_KEY: ${CONTROL_PLANE_SIEM_PREVIOUS_SIGNING_KEY:-}
      CONTROL_PLANE_SIEM_PREVIOUS_SIGNING_KEY_ID: ${CONTROL_PLANE_SIEM_PREVIOUS_SIGNING_KEY_ID:-}
      CONTROL_PLANE_SIEM_REMOTE_SIGNER_ENDPOINT: ${CONTROL_PLANE_SIEM_REMOTE_SIGNER_ENDPOINT:-}
      CONTROL_PLANE_SIEM_REMOTE_SIGNER_BEARER_TOKEN: ${CONTROL_PLANE_SIEM_REMOTE_SIGNER_BEARER_TOKEN:-}
      CONTROL_PLANE_SIEM_REMOTE_SIGNER_ALGORITHM: ${CONTROL_PLANE_SIEM_REMOTE_SIGNER_ALGORITHM:-hmac-sha256-digest}
      CONTROL_PLANE_SIEM_REMOTE_SIGNER_TIMEOUT_MS: ${CONTROL_PLANE_SIEM_REMOTE_SIGNER_TIMEOUT_MS:-3000}
      CONTROL_PLANE_SIEM_AWS_KMS_ENDPOINT: ${CONTROL_PLANE_SIEM_AWS_KMS_ENDPOINT:-}
      CONTROL_PLANE_SIEM_AWS_KMS_REGION: ${CONTROL_PLANE_SIEM_AWS_KMS_REGION:-}
      CONTROL_PLANE_SIEM_AWS_ACCESS_KEY_ID: ${CONTROL_PLANE_SIEM_AWS_ACCESS_KEY_ID:-}
      CONTROL_PLANE_SIEM_AWS_SECRET_ACCESS_KEY: ${CONTROL_PLANE_SIEM_AWS_SECRET_ACCESS_KEY:-}
      CONTROL_PLANE_SIEM_AWS_SESSION_TOKEN: ${CONTROL_PLANE_SIEM_AWS_SESSION_TOKEN:-}
      CONTROL_PLANE_SIEM_AWS_KMS_KEY_ID: ${CONTROL_PLANE_SIEM_AWS_KMS_KEY_ID:-}
      CONTROL_PLANE_SIEM_AWS_KMS_TIMEOUT_MS: ${CONTROL_PLANE_SIEM_AWS_KMS_TIMEOUT_MS:-5000}
      CONTROL_PLANE_SIEM_AWS_CREDENTIALS_SOURCE: ${CONTROL_PLANE_SIEM_AWS_CREDENTIALS_SOURCE:-static}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
