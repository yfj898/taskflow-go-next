name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Module tidy check
        run: go mod tidy -diff -go=1.25.0
      - name: Format check
        run: test -z "$(gofmt -l ./cmd ./internal ./pkg scripts/ai-phase7-client.go scripts/ai-phase10-client/main.go scripts/phase41-oidc-mock.go)"
      - name: Build customer-facing taskflowctl
        run: go build -o /tmp/taskflowctl ./cmd/taskflowctl
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Build binary
        run: |
          CGO_ENABLED=0 go build ./cmd/server
          CGO_ENABLED=0 go build ./cmd/executor-worker
          CGO_ENABLED=0 go build ./cmd/schema-migrate
          CGO_ENABLED=0 go build ./scripts/ai-phase7-client.go
          CGO_ENABLED=0 go build ./scripts/ai-phase10-client
