          python3 -m py_compile scripts/perf-load.py scripts/perf_multi.py scripts/perf_multi_test.py scripts/perf_benchmark_test.py scripts/ai-gateway-mock.py scripts/siem-sink-mock.py scripts/kms-signer-mock.py scripts/aws-kms-mock.py scripts/aws-credentials-mock.py scripts/phase32-governance-mock.py scripts/phase33-governance-retry-check.py scripts/phase34-governance-debt-check.py scripts/phase35-governance-remediation-check.py scripts/phase36-governance-four-eyes-check.py scripts/phase37-governance-approval-lifecycle-check.py scripts/phase38-governance-ha-check.py scripts/phase39-governance-rotation-check.py scripts/phase40-governance-key-retirement-check.py scripts/phase41-oidc-rbac-check.py scripts/phase42-mysql-ha-pitr-check.py scripts/phase43-slo-observability-check.py scripts/phase44-supply-chain-check.py scripts/phase45-multiregion-failover-check.py scripts/phase12-keda-check.py scripts/phase13-k8s-check.py scripts/phase14-k8s-check.py scripts/phase15-coordination-check.py scripts/phase16-fencing-check.py scripts/phase17-compaction-check.py scripts/phase18-dlq-check.py scripts/phase19-dlq-lifecycle-check.py scripts/phase20-dlq-archive-check.py scripts/phase21-dlq-archive-object-check.py scripts/phase22-control-plane-auth-check.py scripts/phase23-control-plane-audit-check.py scripts/phase24-control-plane-integrity-check.py scripts/phase25-siem-delivery-check.py scripts/phase26-siem-ha-kms-check.py scripts/phase27-siem-exactly-once-dr-check.py scripts/phase28-vault-credentials-reconcile-check.py scripts/phase29-receiver-failover-dr-check.py scripts/phase30-receiver-term-failback-dr-check.py scripts/phase31-promotion-workflow-rpo-check.py scripts/phase32-governance-check.py scripts/release-kafka-dlq-check.py scripts/release-k8s-keda-check.py scripts/release-s3-minio-check.py
