  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: taskflow_ci_only
          MYSQL_DATABASE: taskflow_tenant_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptaskflow_ci_only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Create isolated migration schema
        run: docker exec "$(docker ps --filter ancestor=mysql:8.4 -q | head -1)" mysql -uroot -ptaskflow_ci_only -e 'CREATE DATABASE taskflow_schema_ci; CREATE DATABASE taskflow_service_ci; CREATE DATABASE taskflow_workflow_schema_ci'
      - name: Cross-tenant MySQL authorization test
        env:
          TASKFLOW_MYSQL_INTEGRATION_DSN: 'root:taskflow_ci_only@tcp(127.0.0.1:3306)/taskflow_tenant_ci?parseTime=true&charset=utf8mb4'
        run: |
          go test -count=1 ./internal/repository -run '^TestCloudTenantScopeMySQLIntegration$'
          go test -count=1 ./internal/handler -run '^TestCloudTenantRouterMySQLIntegration$'
      - name: Expand/contract schema compatibility test
        env:
          TASKFLOW_SCHEMA_MIGRATION_TEST_DSN: 'root:taskflow_ci_only@tcp(127.0.0.1:3306)/taskflow_schema_ci?parseTime=true&charset=utf8mb4'
        run: go test -count=1 ./internal/schemamigrate -run '^TestCloudOrdersExpandContractMySQL$'
      - name: Managed Saga workflow schema migration and fail-closed startup
        env:
          TASKFLOW_MANAGED_WORKFLOW_TEST_DSN: 'root:taskflow_ci_only@tcp(127.0.0.1:3306)/taskflow_workflow_schema_ci?parseTime=true&charset=utf8mb4'
        run: go test -count=1 ./internal/repository -run '^TestManagedWorkflowSchemaMySQL$'
      - name: Isolated real-MySQL Saga regression
        env:
          TASKFLOW_MYSQL_INTEGRATION_DSN: 'root:taskflow_ci_only@tcp(127.0.0.1:3306)/taskflow_service_ci?parseTime=true&charset=utf8mb4'
        run: go test -count=1 ./internal/service -run '^TestCloudWorkflowSagaIntegration$'

  keycloak-idp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable Keycloak lab passwords
        run: |
          echo "KEYCLOAK_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start real Keycloak 26.8 and isolated PostgreSQL
        run: docker compose -f deploy/keycloak/compose.yaml up -d --no-build
      - name: Wait for OIDC discovery
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:18090/realms/taskflow-lab/.well-known/openid-configuration >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/keycloak/compose.yaml logs --tail=100 keycloak
          exit 1
      - name: Real Keycloak client_credentials and cross-tenant MySQL verification
        run: sh scripts/keycloak-verify.sh
      - name: Build isolated TaskFlow API test image
        run: docker build -t taskflow-go:enterprise-acceptance-20261009 .
      - name: Start independent OIDC-only TaskFlow API
        run: sh scripts/keycloak-stage-up.sh
      - name: Live OIDC authorization smoke
        run: sh scripts/keycloak-live-smoke.sh
      - name: Real consumer command-line API smoke
        run: sh scripts/taskflowctl-keycloak-smoke.sh
      - name: Rotate Keycloak RSA signing key and verify overlap
        run: sh scripts/keycloak-rotation-smoke.sh
      - name: Stop and recover isolated Keycloak identity provider
        run: sh scripts/keycloak-idp-outage-smoke.sh
      - name: Bound short OIDC SLO regression gate
        run: sh scripts/keycloak-slo-run.sh --duration 20 --rate 20 --concurrency 8 --output /tmp/taskflow-keycloak-ci-slo.json
      - name: Checkpointed 72-hour runner smoke (18 seconds, not a full soak)
        run: python3 scripts/keycloak-72h-soak.py --hours 0.005 --window-seconds 9 --rate 10 --concurrency 4 --output /tmp/taskflow-oidc-soak-ci-pilot
      - name: Tear down disposable identity lab
        if: always()
        run: |
          docker rm -f taskflow-keycloak-stage taskflow-keycloak-redis-stage taskflow-keycloak-mysql-ci >/dev/null 2>&1 || true
          docker compose -f deploy/keycloak/compose.yaml down --volumes --remove-orphans

  keycloak-production-mode-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check HTTPS production-mode rehearsal script syntax
        run: bash -n scripts/keycloak-production-mode-smoke.sh
      - name: Start Keycloak in production mode with throwaway HTTPS, check trust and cleanup
        run: bash scripts/keycloak-production-mode-smoke.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config >/dev/null
      - name: Build image
        run: docker build -t taskflow-go:ci .

