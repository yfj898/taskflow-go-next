          sh -n scripts/keycloak-verify.sh scripts/keycloak-live-smoke.sh scripts/keycloak-stage-up.sh scripts/keycloak-rotation-smoke.sh scripts/keycloak-idp-outage-smoke.sh scripts/keycloak-slo-run.sh scripts/cloud-mixed-version-rollout-smoke.sh
